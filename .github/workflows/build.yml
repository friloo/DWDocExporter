name: Build & Release

on:
  push:
    branches: [ main, master, claude/stoic-ride-e145vk ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Wird zum Erstellen/Aktualisieren von Releases benötigt.
permissions:
  contents: write

jobs:
  build:
    # WinForms benötigt Windows zum Bauen.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DwDocExport.csproj

      - name: Build
        run: dotnet build DwDocExport.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/DwDocExport.Tests.csproj -c Release

      - name: Publish (single-file, self-contained, win-x64)
        run: >
          dotnet publish DwDocExport.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DwDocExport-win-x64
          path: publish/DwDocExport.exe

      # Rollendes Beta-Release: bei jedem Push auf den Entwicklungs-Branch wird
      # die EXE unter einem festen Release ("beta") zum Download bereitgestellt.
      - name: Beta-Release aktualisieren (Branch-Push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/stoic-ride-e145vk'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: "DwDocExport – Beta (aktueller Build)"
          prerelease: true
          files: publish/DwDocExport.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DwDocExport.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
